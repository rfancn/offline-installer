services:
  ft-server:
    image: rfancn/file-transfer:latest
    container_name: ft-server
    restart: unless-stopped
    ports:
      - "${FT_PORT}:8080"
    environment:
      TZ: Asia/Shanghai
    volumes:
      # 配置、密钥、日志与上游 docker-compose 保持一致
      - ./config:/etc/file-transfer
      - ./secrets:/app/secrets
      - ./logs:/var/log/file-transfer
    # 接入 web 网络，通过 http://rustfs:9000 访问 RustFS
    networks:
      - web

networks:
  web:
    external: true
