services:
  guacd:
    image: guacamole/guacd:latest
    container_name: guacd
    restart: always
    # guacd 不需要对外暴露端口，仅需内部通信
    # 若需调试可临时映射 4822，生产环境禁止
    networks:
      - guacamole-network
    deploy:                             # 资源限制
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
  guacamole:
    image: guacamole/guacamole:latest
    container_name: guacamole
    restart: always
    ports:
      - "8080:8080"
    environment:
      GUACD_HOSTNAME: guacd          # 指向 guacd 服务名
      GUACD_PORT: 4822
      POSTGRESQL_ENABLED: true
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_DATABASE: guacamole
      POSTGRESQL_USERNAME: guacamole
      POSTGRESQL_PASSWORD: ${GUACAMOLE_DB_PASSWORD}
    volumes:
      - ${PWD}/config/guacamole.properties:/etc/guacamole/guacamole.properties:ro
      - "initdb:/opt/guacamole/extensions/guacamole-auth-jdbc/postgresql/schema:ro"
    networks:
      - guacamole-network
    depends_on:
      postgres:
        condition: service_healthy      # 等待数据库就绪
      guacd:
        condition: service_started
  postgres:
    image: postgres:17 
    container_name: postgres17 
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - default_statistics_target=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - work_mem=4MB
      - -c
      - min_wal_size=1GB
      - -c
      - max_wal_size=4GB
    environment:
      POSTGRES_DB: guacamole
      POSTGRES_USER: guacamole
      POSTGRES_PASSWORD: ${GUACAMOLE_DB_PASSWORD}
    volumes:
      - ${PWD}/db:/var/lib/postgresql/data
      - "initdb:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guacamole -d guacamole"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - guacamole-network
networks:
  guacamole-network:
    driver: bridge
volumes:
    initdb:
