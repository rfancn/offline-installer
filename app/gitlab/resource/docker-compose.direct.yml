services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    restart: always
    shm_size: '256m'
    hostname: '${GITLAB_HOST}'
    ports:
      - "${GITLAB_HTTP_PORT}:80"
    environment:
      TZ: 'Asia/Shanghai'
      GITLAB_OMNIBUS_CONFIG: |
        # 直接访问模式：使用宿主机地址与端口生成外部访问地址
        external_url '${GITLAB_EXTERNAL_URL}'
        nginx['listen_port'] = 80             # 容器内部只监听 HTTP 80 端口
        nginx['listen_https'] = false         # 关闭容器内部的 HTTPS

        # 禁用 SSH 功能
        sshd['enable'] = false
        gitlab_rails['gitlab_shell_ssh_port'] = nil

        # 针对低配服务器的优化（可选）
        puma['worker_processes'] = 2
        sidekiq['concurrency'] = 10
    volumes:
      - ./config:/etc/gitlab
      - ./logs:/var/log/gitlab
      - ./data:/var/opt/gitlab
