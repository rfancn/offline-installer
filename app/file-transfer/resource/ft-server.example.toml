# ft-server 配置
# 大小支持 B/KiB/MiB/GiB/TiB，时长支持 Go duration（如 24h、168h）。

[server]
  listen = ":8080"
  log_file = "/var/log/file-transfer/ft-server.log"  # 运行日志（SDK 会在同目录下建同名子目录）

[s3]
  endpoint = "__S3_ENDPOINT__"
  bucket = "file-transfer"
  region = "us-east-1"
  # 服务身份凭据由 ft-admin init 写入当前工作目录 secrets/s3_credentials.json，不在本文件中配置

[auth]
  # 以下密钥由安装脚本随机生成
  token_secret = "__TOKEN_SECRET__"
  token_ttl = "24h"
  upload_secret = "__UPLOAD_SECRET__"
  multipart_ttl = "168h"

# 清理任务默认保留天数；0 表示不自动清理。
[retention]
  inbound_days = 3
  outbound_days = 0
  upload_days = 3
  incomplete_days = 3

# 运行日志由 SDK 内置的 lumberjack 轮转。
# 实际路径为 <log_file 所在目录>/<文件名去扩展名>/<文件名>。
[log]
  max_age_days = 30     # 历史文件保留天数，0 表示不限制
  max_backups = 30      # 最多保留的历史文件数，0 表示不限制
  max_size_mb = 100     # 单个文件上限（MiB）
  compress = true       # 历史文件 gzip 压缩

# 分片策略（默认值已完整保留，可直接修改）
[multipart]
  direct_max = "100MiB"
  max_part = "512MiB"

  [[multipart.tiers]]
    max = "5GiB"
    part = "16MiB"

  [[multipart.tiers]]
    max = "50GiB"
    part = "32MiB"

  [[multipart.tiers]]
    max = "625GiB"
    part = "64MiB"

  [[multipart.tiers]]
    max = "1.25TiB"
    part = "128MiB"
