services:
  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: rustfs
    restart: unless-stopped
    ports:
      - "${RUSTFS_S3_PORT}:9000"
    networks:
      - web
    volumes:
      - ./data:/data
      - ./logs:/logs
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rustfs-console.rule=Host(`__CONSOLE_HOST__`)"
      - "traefik.http.routers.rustfs-console.entrypoints=websecure"
      - "traefik.http.routers.rustfs-console.tls=true"
      - "traefik.http.services.rustfs-console.loadbalancer.server.port=9001"

networks:
  web:
    external: true