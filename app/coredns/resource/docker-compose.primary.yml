services:
  coredns:
    image: coredns/coredns:${COREDNS_VERSION}
    container_name: coredns-primary
    restart: unless-stopped
    ports:
      - "${PRIMARY_IP}:53:53/udp"
      - "${PRIMARY_IP}:53:53/tcp"
      - "9153:9153/tcp"
    volumes:
      - ${CONFIG_DIR}/Corefile:/etc/coredns/Corefile:ro
      - ${CONFIG_DIR}/zones:/etc/coredns/zones:ro
    command: -conf /etc/coredns/Corefile
    healthcheck:
      test: ["CMD-SHELL", "/coredns -conf /etc/coredns/Corefile -validate && echo ok || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
