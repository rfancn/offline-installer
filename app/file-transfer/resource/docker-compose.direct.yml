services:
  ft-server:
    image: rfancn/file-transfer:latest
    container_name: ft-server
    restart: unless-stopped
    ports:
      - "${FT_PORT}:8080"
    environment:
      TZ: Asia/Shanghai
      # IAM 策略目录；镜像内默认为该路径
      FT_POLICY_DIR: /etc/file-transfer/policy
    volumes:
      # 配置、策略、密钥、日志与上游 docker-compose 保持一致
      - ./config:/etc/file-transfer
      - ./policy:/etc/file-transfer/policy:ro
      - ./secrets:/app/secrets
      - ./logs:/var/log/file-transfer
    # 接入 web 网络，通过 http://rustfs:9000 访问 RustFS
    networks:
      - web

networks:
  web:
    external: true
