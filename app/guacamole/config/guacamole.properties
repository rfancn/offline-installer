# ============================================================
# Guacamole Properties - VNC & RDP Optimized Configuration
# ============================================================

# -------------------- 基础认证 --------------------
# 使用 MySQL 作为用户/连接存储后端（与 docker-compose.yml 配合）
auth-provider: net.sourceforge.guacamole.net.auth.mysql.MySQLAuthenticationProvider

# -------------------- 密码策略 --------------------
password-min-length: 8
password-require-uppercase: 1
password-require-lowercase: 1
password-require-digit: 1
password-require-symbol: 1
# 密码过期天数（0=永不过期）
password-expiration-age: 90

# -------------------- 会话安全 --------------------
# 空闲超时（秒）：无操作自动断开，防止未授权访问
idle-timeout: 1800
# 绝对超时（秒）：无论是否活跃，最长会话时长
# absolute-timeout: 28800
# 并发会话限制
max-active-sessions-per-user: 1 
# 禁止同一用户多设备同时登录（可选，按需开启）
# disallow-simultaneous-connections: true
# 禁止同一连接被多人共享
disallow-duplicate-connections: true

# -------------------- VNC 全局默认值 --------------------
# VNC 编码优先级（性能优化）
vnc-default-encodings: tight zrle hextile copyrect rre
# VNC 颜色深度（32/24/16/8），16位平衡画质与带宽
vnc-default-color-depth: 16
# VNC 光标渲染模式（local=本地渲染减少延迟）
vnc-default-cursor: local
# VNC 剪贴板编码
vnc-default-clipboard-encoding: UTF-8

# -------------------- RDP 全局默认值 --------------------
# RDP 安全模式（any=自动协商，兼容新旧Windows Server）
rdp-default-security: any
# RDP 忽略服务器证书警告（内网环境推荐开启）
rdp-default-ignore-cert: true
# RDP 启用壁纸/主题/字体平滑等体验优化（按需关闭以节省带宽）
rdp-default-enable-wallpaper: false
rdp-default-enable-theming: false
rdp-default-enable-font-smoothing: false
rdp-default-enable-desktop-composition: false
rdp-default-enable-menu-animations: false
# RDP 音频重定向
rdp-default-enable-audio: true
# RDP 打印机重定向（按需开启）
rdp-default-enable-printing: false
# RDP 驱动器重定向（⚠️ 安全风险，生产环境建议关闭）
rdp-default-enable-drive: false
# RDP 控制台模式（连接 Windows Server 管理会话）
rdp-default-console: false

# -------------------- 界面与国际化 --------------------
# 默认语言
default-language: zh_CN
# 允许的时区列表
allowed-timezones: Asia/Shanghai,UTC
# 禁用内置用户管理（仅通过MySQL/API管理）
# disable-user-management: true

# -------------------- 日志级别 --------------------
# TRACE/DEBUG/INFO/WARN/ERROR
log-level: INFO
