services:
  # Mattermost 应用服务
  mattermost-app:
    #image: mattermost/mattermost-team-edition:latest
    image: mattermost/mattermost-team-edition:release-10  
    container_name: mattermost-app
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@mattermost-postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: ${SITE_URL} 
      MM_LOGSETTINGS_ENABLEDIAGNOSTICS: false
    depends_on:
      mattermost-postgres:
        condition: service_healthy
    volumes:
      - ./config:/mattermost/config
      - ./data:/mattermost/data
      - ./logs:/mattermost/logs
      - ./plugins:/mattermost/plugins
      - ./client-plugins:/mattermost/client/plugins
      - ./bleve-indexes:/mattermost/bleve-indexes
    networks:
      - web 
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mattermost.rule=Host(`${SITE_HOST}`)"
      - "traefik.http.routers.mattermost.entrypoints=websecure"
      - "traefik.http.routers.mattermost.tls=true"
      - "traefik.http.services.mattermost.loadbalancer.server.port=8065"

  # PostgreSQL 数据库服务
  mattermost-postgres:
    image: postgres:17
    container_name: mattermost-postgres17
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      POSTGRES_USER: ${POSTGRES_USER} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mattermost
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - ./db:/var/lib/postgresql/data
    networks:
      - web 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d mattermost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  web:
    external: true
